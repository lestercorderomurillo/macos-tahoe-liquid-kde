<?xml version="1.0" encoding="UTF-8"?>
<!-- Boot-progress track: a thin pill, 20% white on black for a subtle
     "groove" that the fill grows along. Native size 320x6 — the .script
     rescales to a fraction of screen width at runtime. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="6" viewBox="0 0 320 6">
  <rect width="320" height="6" rx="3" ry="3" fill="#ffffff" fill-opacity="0.2"/>
</svg>
