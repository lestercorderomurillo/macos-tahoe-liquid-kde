<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- These bundled Bold and Bold Italic faces declare the Semibold weight. -->
  <match target="scan">
    <test name="family" compare="contains"><string>SF Pro</string></test>
    <test name="style" compare="eq"><string>Bold</string></test>
    <test name="weight" compare="eq"><const>demibold</const></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>SF Pro</string></test>
    <test name="style" compare="eq"><string>Bold Italic</string></test>
    <test name="weight" compare="eq"><const>demibold</const></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
