#cloud-config
# Gentoo cloud smoke guest: boot the official systemd cloud-init qcow2,
# switch to the Plasma systemd profile, use the official binhost where
# possible, then run the full install + uninstall flow in a real Plasma
# session.

users:
  - default
  - name: tester
    gecos: Gentoo Smoke
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tester

ssh_pwauth: true
chpasswd:
  expire: false

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      append_make_conf() {
          local line="$1"
          if ! grep -Fqx "$line" /etc/portage/make.conf 2>/dev/null; then
              printf '%s\n' "$line" >> /etc/portage/make.conf
          fi
      }

      select_plasma_profile() {
          local profile_num
          profile_num="$(
              eselect profile list \
                  | sed -n 's/^.*\[\([0-9][0-9]*\)\].*desktop\/plasma\/systemd.*$/\1/p' \
                  | tail -n 1
          )"
          if [[ -z "$profile_num" ]]; then
              echo "No desktop/plasma/systemd Gentoo profile found" >&2
              exit 1
          fi
          eselect profile set "$profile_num"
      }

      configure_binhost() {
          mkdir -p \
              /etc/portage/binrepos.conf \
              /etc/portage/package.accept_keywords \
              /etc/portage/package.use

          cat > /etc/portage/binrepos.conf/gentoo-binhost.conf <<'EOF'
      [binhost]
      priority = 9999
      sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
      EOF

          cat > /etc/portage/package.accept_keywords/all <<'EOF'
      */* ~amd64
      EOF

          cat > /etc/portage/package.use/libxkbcommon <<'EOF'
      x11-libs/libxkbcommon X
      EOF

          if command -v getuto >/dev/null 2>&1; then
              append_make_conf 'FEATURES="${FEATURES} getbinpkg binpkg-request-signature binpkg-multi-instance"'
              getuto
          else
              append_make_conf 'FEATURES="${FEATURES} getbinpkg binpkg-multi-instance"'
          fi
          append_make_conf 'EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --binpkg-respect-use=n --binpkg-changed-deps=n --usepkg --with-bdeps=y"'
      }

      emerge_binpkg() {
          emerge --quiet --getbinpkg --usepkg \
              --binpkg-respect-use=n --binpkg-changed-deps=n \
              --with-bdeps=y "$@"
      }

      emerge_binpkg_with_autounmask() {
          # Try the happy path first.
          if emerge_binpkg "$@"; then
              return 0
          fi

          # First pass: write USE/keyword unmasks portage suggests, but
          # also keep going so it actually merges what it can. Without
          # --autounmask-continue=y emerge writes the config files and
          # then exits without merging anything, leaving us back at
          # square one after etc-update.
          emerge --quiet --getbinpkg --usepkg \
              --binpkg-respect-use=n --binpkg-changed-deps=n \
              --with-bdeps=y --keep-going=y \
              --autounmask-write --autounmask-continue=y \
              --autounmask-keep-keywords=y \
              "$@" || true
          etc-update --automode -5 >/dev/null || true

          # Second pass: same again. The first pass writes config; the
          # second actually merges with those flags now visible.
          emerge --quiet --getbinpkg --usepkg \
              --binpkg-respect-use=n --binpkg-changed-deps=n \
              --with-bdeps=y --keep-going=y \
              --autounmask-write --autounmask-continue=y \
              "$@" || true
          etc-update --automode -5 >/dev/null || true

          # Final pass: plain emerge — anything still failing here is
          # a real slot conflict and we want the non-zero exit so the
          # smoke marks failure rather than booting into a half-broken
          # system.
          emerge_binpkg --keep-going=y "$@"
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      emerge-webrsync --revert=@GENTOO_SNAPSHOT_DATE@
      configure_binhost
      select_plasma_profile
      env-update

      # Single meta target instead of individually-pinned plasma-*
      # components. Pulling kde-plasma/plasma-workspace directly forces
      # portage to satisfy dev-libs/qcoro and dev-qt/qtdeclarative
      # against whichever slots happen to be in the binhost vs the
      # ebuild tree at the moment, which has historically triggered
      # an unresolvable qtdeclarative:6 slot conflict between binhost
      # qcoro (~6.10.2) and tree qt5compat (~6.11.1). plasma-meta lets
      # portage solve the whole graph at once with a consistent slot
      # set. Build deps (sudo / ssh / rsync) come in as plasma-meta
      # transitives or are already present on the cloudinit image.
      emerge_binpkg_with_autounmask --update --deep --newuse \
          kde-plasma/plasma-meta \
          x11-misc/sddm \
          kde-apps/spectacle \
          net-misc/openssh \
          net-misc/rsync \
          app-admin/sudo

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/sddm.service ]] || \
           [[ -f /lib/systemd/system/sddm.service ]] || \
           [[ -f /etc/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      cat > /home/tester/run-smoke.sh <<'EOF'
      #!/bin/bash
      set -euo pipefail

      DONE=/home/tester/smoke.done
      RUNNING=/home/tester/smoke.running
      LOG=/home/tester/smoke.log

      if [[ -e "$DONE" || -e "$RUNNING" ]]; then
          exit 0
      fi

      touch "$RUNNING"
      rm -f "$LOG" /home/tester/desktop.png
      exec > >(tee -a "$LOG") 2>&1

      cleanup() {
          local rc=$?
          rm -f "$RUNNING"
          if (( rc != 0 )); then
              echo "=== failure rc=${rc} ==="
          fi
          touch "$DONE"
      }
      trap cleanup EXIT

      sleep 45
      START_TS="$(date --iso-8601=seconds)"

      echo "=== gentoo-profile ==="
      eselect profile show || true

      echo "=== gentoo-portage ==="
      grep -nE '^(FEATURES|EMERGE_DEFAULT_OPTS)=' /etc/portage/make.conf || true
      grep -n '^sync-uri = ' /etc/portage/binrepos.conf/gentoo-binhost.conf || true

      sudo mkdir -p /repo
      sudo modprobe 9p || true
      sudo modprobe 9pnet_virtio || true
      if ! sudo mountpoint -q /repo; then
          sudo mount -t 9p \
              -o trans=virtio,version=9p2000.L,msize=262144,ro \
              repo /repo
      fi

      rm -rf /home/tester/repo
      mkdir -p /home/tester/repo
      tar -C /repo \
          --exclude=.git \
          --exclude=build \
          --exclude=tests/vm-smoke/.work \
          --exclude=tests/vm/output \
          -cf - . \
          | tar -C /home/tester/repo -xf -

      cd /home/tester/repo
      export MTTKDE_NO_CONFIRM=1

      echo "=== preflight ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install --preflight

      echo "=== install ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install

      echo "=== journal-after-install ==="
      journalctl --user --since="$START_TS" -p err --no-pager || true

      echo "=== screenshot ==="
      if command -v spectacle >/dev/null; then
          spectacle --background --nonotify --fullscreen \
              --output /home/tester/desktop.png || true
      fi

      echo "=== uninstall ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./uninstall

      echo "=== done ==="
      EOF

      chmod 0755 /home/tester/run-smoke.sh

      cat > /home/tester/.config/autostart/mttkde-smoke.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=MacTahoe Liquid KDE Smoke
      Exec=/home/tester/run-smoke.sh
      X-GNOME-Autostart-enabled=true
      X-KDE-autostart-after=panel
      Terminal=false
      EOF

      chown -R tester:tester /home/tester/run-smoke.sh /home/tester/.config

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
