#cloud-config
# Nobara smoke guest: start from the Fedora Cloud Base image, add the
# Nobara repos (Fyra Labs) as an overlay, then `dnf install` Nobara's
# forked plasma-workspace and the rest of the KDE stack. Run the full
# install + uninstall flow in a real Plasma session.
#
# We deliberately write the Nobara .repo file directly rather than
# pulling Fyra Labs' nobara-repos.rpm — that RPM name has historically
# shifted between Fedora versions (nobara-repos-fedora<N>.rpm), and a
# baseurl-pointing .repo survives those renames without code edits.

users:
  - default
  - name: tester
    gecos: Nobara Smoke
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tester

ssh_pwauth: true
chpasswd:
  expire: false

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: true
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      install_nobara_repos() {
          # Resolve the matching Nobara channel for the guest's Fedora
          # release. Fyra Labs publishes per-release dirs at
          # https://repos.fyralabs.com/nobara<N>/ — we probe and pick
          # the first one that resolves cleanly.
          local fedora_ver
          fedora_ver="$(rpm -E %fedora 2>/dev/null || echo 44)"

          local mirror="https://repos.fyralabs.com/nobara${fedora_ver}"
          if ! curl -sfI "${mirror}/" >/dev/null 2>&1; then
              echo "Nobara channel for Fedora ${fedora_ver} not yet published at ${mirror}/" >&2
              # Fall back to the highest-numbered published channel so
              # the smoke still exercises a real Nobara repo even when
              # Fyra Labs is one Fedora behind.
              local candidate
              for candidate in 44 43 42 41 40; do
                  if curl -sfI "https://repos.fyralabs.com/nobara${candidate}/" >/dev/null 2>&1; then
                      mirror="https://repos.fyralabs.com/nobara${candidate}"
                      break
                  fi
              done
          fi

          # Pull the GPG key Fyra Labs uses to sign the repo. Their key
          # lives at the channel root.
          curl -L --fail "${mirror}/RPM-GPG-KEY-fyralabs" \
              -o /etc/pki/rpm-gpg/RPM-GPG-KEY-nobara || \
          curl -L --fail "${mirror}/nobara.gpg" \
              -o /etc/pki/rpm-gpg/RPM-GPG-KEY-nobara || true

          cat > /etc/yum.repos.d/nobara.repo <<EOF
      [nobara-baseos]
      name=Nobara BaseOS
      baseurl=${mirror}/baseos/x86_64
      enabled=1
      gpgcheck=1
      gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara

      [nobara-appstream]
      name=Nobara AppStream
      baseurl=${mirror}/appstream/x86_64
      enabled=1
      gpgcheck=1
      gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara

      [nobara-extras]
      name=Nobara Extras
      baseurl=${mirror}/extras/x86_64
      enabled=1
      gpgcheck=1
      gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara
      EOF

          dnf clean all
          dnf --refresh repolist
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      install_nobara_repos

      # Install KDE plus Nobara's forked plasma-workspace where it
      # overrides Fedora's; --allowerasing lets dnf swap the
      # conflicting Fedora packages.
      dnf install -y --allowerasing --setopt=install_weak_deps=False \
          @kde-desktop-environment \
          spectacle \
          extra-cmake-modules \
          kdecoration-devel \
          kf6-kcmutils-devel \
          kf6-kconfig-devel \
          kf6-kconfigwidgets-devel \
          kf6-kcoreaddons-devel \
          kf6-kcrash-devel \
          kf6-kglobalaccel-devel \
          kf6-kguiaddons-devel \
          kf6-ki18n-devel \
          kf6-kitemmodels-devel \
          kf6-kio-devel \
          kf6-knotifications-devel \
          kf6-kservice-devel \
          kf6-kwidgetsaddons-devel \
          kf6-kwindowsystem-devel \
          libdrm-devel \
          kwin-devel \
          libX11-devel \
          libepoxy-devel \
          libksysguard-devel \
          libplasma-devel \
          libxcb-devel \
          plasma-activities-devel \
          plasma-activities-stats-devel \
          plasma-workspace-devel \
          qt6-qttools-devel

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/plasmalogin.service ]]; then
          mkdir -p /etc/plasmalogin.conf.d
          cat > /etc/plasmalogin.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable plasmalogin.service
      elif [[ -f /usr/lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      cat > /home/tester/run-smoke.sh <<'EOF'
      #!/bin/bash
      set -euo pipefail

      DONE=/home/tester/smoke.done
      RUNNING=/home/tester/smoke.running
      LOG=/home/tester/smoke.log

      if [[ -e "$DONE" || -e "$RUNNING" ]]; then
          exit 0
      fi

      touch "$RUNNING"
      rm -f "$LOG" /home/tester/desktop.png
      exec > >(tee -a "$LOG") 2>&1

      cleanup() {
          local rc=$?
          rm -f "$RUNNING"
          if (( rc != 0 )); then
              echo "=== failure rc=${rc} ==="
          fi
          touch "$DONE"
      }
      trap cleanup EXIT

      sleep 45
      START_TS="$(date --iso-8601=seconds)"

      echo "=== nobara-repos ==="
      ls /etc/yum.repos.d/ || true
      cat /etc/yum.repos.d/nobara.repo 2>/dev/null || true

      sudo mkdir -p /repo
      sudo modprobe 9p || true
      sudo modprobe 9pnet_virtio || true
      if ! sudo mountpoint -q /repo; then
          sudo mount -t 9p \
              -o trans=virtio,version=9p2000.L,msize=262144,ro \
              repo /repo
      fi

      rm -rf /home/tester/repo
      mkdir -p /home/tester/repo
      tar -C /repo \
          --exclude=.git \
          --exclude=build \
          --exclude=tests/vm-smoke/.work \
          --exclude=tests/vm/output \
          -cf - . \
          | tar -C /home/tester/repo -xf -

      cd /home/tester/repo
      export MTTKDE_NO_CONFIRM=1

      echo "=== preflight ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install --preflight

      echo "=== install ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install

      echo "=== journal-after-install ==="
      journalctl --user --since="$START_TS" -p err --no-pager || true

      echo "=== screenshot ==="
      if command -v spectacle >/dev/null; then
          spectacle --background --nonotify --fullscreen \
              --output /home/tester/desktop.png || true
      fi

      echo "=== uninstall ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./uninstall

      echo "=== done ==="
      EOF

      chmod 0755 /home/tester/run-smoke.sh

      cat > /home/tester/.config/autostart/mttkde-smoke.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=MacTahoe Liquid KDE Smoke
      Exec=/home/tester/run-smoke.sh
      X-GNOME-Autostart-enabled=true
      X-KDE-autostart-after=panel
      Terminal=false
      EOF

      chown -R tester:tester /home/tester/run-smoke.sh /home/tester/.config

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
