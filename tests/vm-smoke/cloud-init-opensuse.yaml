#cloud-config
# openSUSE Tumbleweed cloud smoke guest: install KDE, reboot into a
# real Plasma session, then run ./install + ./uninstall from an
# autostart.

users:
  - default
  - name: tester
    gecos: openSUSE Smoke
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tester

ssh_pwauth: true
chpasswd:
  expire: false

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: true
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      zypper --non-interactive refresh
      zypper --non-interactive install --no-recommends \
          openssh \
          patterns-kde-kde_plasma \
          qt6-tools-devel \
          rsync \
          sddm \
          spectacle \
          sudo \
          xorg-x11-server

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /etc/sysconfig/displaymanager ]]; then
          if grep -q '^DISPLAYMANAGER=' /etc/sysconfig/displaymanager; then
              sed -i 's/^DISPLAYMANAGER=.*/DISPLAYMANAGER="sddm"/' /etc/sysconfig/displaymanager
          else
              printf 'DISPLAYMANAGER="sddm"\n' >> /etc/sysconfig/displaymanager
          fi
          if grep -q '^DISPLAYMANAGER_AUTOLOGIN=' /etc/sysconfig/displaymanager; then
              sed -i 's/^DISPLAYMANAGER_AUTOLOGIN=.*/DISPLAYMANAGER_AUTOLOGIN="tester"/' /etc/sysconfig/displaymanager
          else
              printf 'DISPLAYMANAGER_AUTOLOGIN="tester"\n' >> /etc/sysconfig/displaymanager
          fi
          if grep -q '^DISPLAYMANAGER_PASSWORD_LESS_LOGIN=' /etc/sysconfig/displaymanager; then
              sed -i 's/^DISPLAYMANAGER_PASSWORD_LESS_LOGIN=.*/DISPLAYMANAGER_PASSWORD_LESS_LOGIN="yes"/' /etc/sysconfig/displaymanager
          else
              printf 'DISPLAYMANAGER_PASSWORD_LESS_LOGIN="yes"\n' >> /etc/sysconfig/displaymanager
          fi
      fi

      if [[ -f /usr/lib/systemd/system/plasmalogin.service ]]; then
          mkdir -p /etc/plasmalogin.conf.d
          cat > /etc/plasmalogin.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable plasmalogin.service
      elif [[ -L /etc/systemd/system/display-manager.service ]] || \
           [[ -f /usr/lib/systemd/system/display-manager-legacy.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          # openSUSE keeps display-manager.service enabled already and
          # switches the concrete DM through /etc/sysconfig/displaymanager.
          # Re-enabling here can fail because the symlink already points
          # at display-manager-legacy.service; the reboot picks up the new
          # DISPLAYMANAGER="sddm" value just fine without it.
          true
      elif [[ -f /usr/lib/systemd/system/sddm.service ]] || \
           [[ -f /lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      cat > /home/tester/run-smoke.sh <<'EOF'
      #!/bin/bash
      set -euo pipefail

      DONE=/home/tester/smoke.done
      RUNNING=/home/tester/smoke.running
      LOG=/home/tester/smoke.log

      if [[ -e "$DONE" || -e "$RUNNING" ]]; then
          exit 0
      fi

      touch "$RUNNING"
      rm -f "$LOG" /home/tester/desktop.png
      exec > >(tee -a "$LOG") 2>&1

      cleanup() {
          local rc=$?
          rm -f "$RUNNING"
          if (( rc != 0 )); then
              echo "=== failure rc=${rc} ==="
          fi
          touch "$DONE"
      }
      trap cleanup EXIT

      sleep 45
      START_TS="$(date --iso-8601=seconds)"

      sudo mkdir -p /repo
      sudo modprobe 9p || true
      sudo modprobe 9pnet_virtio || true
      if ! sudo mountpoint -q /repo; then
          sudo mount -t 9p \
              -o trans=virtio,version=9p2000.L,msize=262144,ro \
              repo /repo
      fi

      rm -rf /home/tester/repo
      mkdir -p /home/tester/repo
      tar -C /repo \
          --exclude=.git \
          --exclude=build \
          --exclude=tests/vm-smoke/.work \
          --exclude=tests/vm/output \
          -cf - . \
          | tar -C /home/tester/repo -xf -

      cd /home/tester/repo
      export MTTKDE_NO_CONFIRM=1

      echo "=== preflight ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install --preflight

      echo "=== install ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install

      echo "=== journal-after-install ==="
      journalctl --user --since="$START_TS" -p err --no-pager || true

      echo "=== screenshot ==="
      if command -v spectacle >/dev/null; then
          spectacle --background --nonotify --fullscreen \
              --output /home/tester/desktop.png || true
      fi

      echo "=== uninstall ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./uninstall

      echo "=== done ==="
      EOF

      chmod 0755 /home/tester/run-smoke.sh

      cat > /home/tester/.config/autostart/mttkde-smoke.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=MacTahoe Liquid KDE Smoke
      Exec=/home/tester/run-smoke.sh
      X-GNOME-Autostart-enabled=true
      X-KDE-autostart-after=panel
      Terminal=false
      EOF

      chown -R tester:tester /home/tester/run-smoke.sh /home/tester/.config

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
