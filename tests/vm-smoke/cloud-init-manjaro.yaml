#cloud-config
# Manjaro smoke guest: start from the Arch cloud image, swap the guest
# onto Manjaro's stable repos, then run the full install + uninstall
# flow in a real Plasma session.

users:
  - default
  - name: tester
    gecos: Manjaro Smoke
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tester

ssh_pwauth: true
chpasswd:
  expire: false

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      install_manjaro_repos() {
          # Manjaro's stable branch uses a custom mirror redirector. Grab
          # the keyring + manjaro-system packages directly from the
          # repo, install them under the still-Arch pacman, then rewrite
          # /etc/pacman.conf and mirrorlist to point at Manjaro.
          local mirror="https://mirror.alpix.eu/manjaro/stable"
          local tmp
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' RETURN

          # Pull the current keyring + system packages from Manjaro core.
          # We resolve the exact filename from the repo index so this
          # survives keyring version bumps without code edits.
          local keyring_pkg sys_pkg
          keyring_pkg="$(curl -sL "${mirror}/core/x86_64/" \
              | grep -oE 'manjaro-keyring-[0-9][^"<]*-any\.pkg\.tar\.zst' \
              | sort -V | tail -1)"
          sys_pkg="$(curl -sL "${mirror}/core/x86_64/" \
              | grep -oE 'manjaro-system-[0-9][^"<]*-any\.pkg\.tar\.zst' \
              | sort -V | tail -1)"
          if [[ -z "$keyring_pkg" || -z "$sys_pkg" ]]; then
              echo "could not resolve manjaro-keyring / manjaro-system from ${mirror}" >&2
              exit 1
          fi

          curl -L --fail "${mirror}/core/x86_64/${keyring_pkg}" \
              -o "$tmp/manjaro-keyring.pkg.tar.zst"
          curl -L --fail "${mirror}/core/x86_64/${sys_pkg}" \
              -o "$tmp/manjaro-system.pkg.tar.zst"

          pacman -U --noconfirm \
              "$tmp/manjaro-keyring.pkg.tar.zst" \
              "$tmp/manjaro-system.pkg.tar.zst"

          if ! pacman-key -l >/dev/null 2>&1; then
              pacman-key --init
          fi
          pacman-key --populate manjaro

          # Rewrite mirrorlist + pacman.conf to point at Manjaro stable.
          cat > /etc/pacman.d/mirrorlist <<EOF
      ## Manjaro stable mirrorlist (smoke harness)
      Server = ${mirror}/\$repo/\$arch
      EOF

          cat > /etc/pacman.conf <<'EOF'
      [options]
      HoldPkg     = pacman glibc
      Architecture = auto
      CheckSpace
      SigLevel    = Required DatabaseOptional
      LocalFileSigLevel = Optional

      [core]
      Include = /etc/pacman.d/mirrorlist

      [extra]
      Include = /etc/pacman.d/mirrorlist

      [community]
      Include = /etc/pacman.d/mirrorlist

      [multilib]
      Include = /etc/pacman.d/mirrorlist
      EOF

          # Full system upgrade onto Manjaro stable. -yy forces a fresh
          # db sync after the repo swap; -uu allows downgrades where
          # Manjaro is behind Arch on a package.
          pacman -Syyuu --noconfirm --overwrite='*'
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      pacman -Sy --noconfirm
      pacman -S --noconfirm --needed \
          base-devel \
          curl \
          gawk \
          openssh \
          rsync \
          sudo

      install_manjaro_repos

      pacman -S --noconfirm --needed \
          extra-cmake-modules \
          kdecoration \
          libksysguard \
          libplasma \
          plasma-activities-stats \
          plasma-meta \
          plasma-workspace \
          qt6-tools \
          sddm \
          spectacle

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/sddm.service ]] || \
         [[ -f /lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      cat > /home/tester/run-smoke.sh <<'EOF'
      #!/bin/bash
      set -euo pipefail

      DONE=/home/tester/smoke.done
      RUNNING=/home/tester/smoke.running
      LOG=/home/tester/smoke.log

      if [[ -e "$DONE" || -e "$RUNNING" ]]; then
          exit 0
      fi

      touch "$RUNNING"
      rm -f "$LOG" /home/tester/desktop.png
      exec > >(tee -a "$LOG") 2>&1

      cleanup() {
          local rc=$?
          rm -f "$RUNNING"
          if (( rc != 0 )); then
              echo "=== failure rc=${rc} ==="
          fi
          touch "$DONE"
      }
      trap cleanup EXIT

      sleep 45
      START_TS="$(date --iso-8601=seconds)"

      echo "=== manjaro-repos ==="
      grep -n '^\[' /etc/pacman.conf || true
      cat /etc/pacman.d/mirrorlist || true

      sudo mkdir -p /repo
      sudo modprobe 9p || true
      sudo modprobe 9pnet_virtio || true
      if ! sudo mountpoint -q /repo; then
          sudo mount -t 9p \
              -o trans=virtio,version=9p2000.L,msize=262144,ro \
              repo /repo
      fi

      rm -rf /home/tester/repo
      mkdir -p /home/tester/repo
      tar -C /repo \
          --exclude=.git \
          --exclude=build \
          --exclude=tests/vm-smoke/.work \
          --exclude=tests/vm/output \
          -cf - . \
          | tar -C /home/tester/repo -xf -

      cd /home/tester/repo
      export MTTKDE_NO_CONFIRM=1

      echo "=== preflight ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install --preflight

      echo "=== install ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./install

      echo "=== journal-after-install ==="
      journalctl --user --since="$START_TS" -p err --no-pager || true

      echo "=== screenshot ==="
      if command -v spectacle >/dev/null; then
          spectacle --background --nonotify --fullscreen \
              --output /home/tester/desktop.png || true
      fi

      echo "=== uninstall ==="
      sudo --preserve-env=MTTKDE_NO_CONFIRM ./uninstall

      echo "=== done ==="
      EOF

      chmod 0755 /home/tester/run-smoke.sh

      cat > /home/tester/.config/autostart/mttkde-smoke.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=MacTahoe Liquid KDE Smoke
      Exec=/home/tester/run-smoke.sh
      X-GNOME-Autostart-enabled=true
      X-KDE-autostart-after=panel
      Terminal=false
      EOF

      chown -R tester:tester /home/tester/run-smoke.sh /home/tester/.config

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
