name: Reuse weekly distro SDK
description: Pull a source-free SDK keyed by its recipe and week; build only on a miss.
inputs:
  distro:
    required: true
    description: Dockerfile suffix
outputs:
  image:
    description: Local SDK image reference
    value: ${{ steps.image.outputs.image }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - id: image
      shell: bash
      env:
        DISTRO: ${{ inputs.distro }}
        REPOSITORY: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
      run: bash "$GITHUB_ACTION_PATH/cache.sh"
