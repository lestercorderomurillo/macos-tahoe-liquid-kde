name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: bash tests/test.sh

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KDE build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config extra-cmake-modules \
            libkf6coreaddons-dev libkf6config-dev \
            libplasma-dev qt6-base-dev qt6-declarative-dev \
            libkf6windowsystem-dev libkf6i18n-dev \
            libtaskmanager-dev libkf6dbusaddons-dev \
            libkf6kcmutils-dev libkf6iconthemes-dev \
            libkdecorations3-dev kwin-dev \
            qt6-wayland-dev
      - name: Build Menu applet
        run: |
          cd src/offline/plasmoids/org.kde.mac-tahoe-liquid-kde.menu
          mkdir build && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Build Global Menu applet
        run: |
          cd src/offline/plasmoids/org.kde.mac-tahoe-liquid-kde.globalmenu
          mkdir build && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
