name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: |
          pacman -Syu --noconfirm \
            python python-pytest bash git diffutils findutils \
            base-devel cmake extra-cmake-modules \
            qt6-base qt6-declarative qt6-wayland \
            libplasma kconfig kcoreaddons \
            kwindowsystem ki18n kdbusaddons \
            kcmutils kiconthemes \
            kdecoration plasma-workspace
      - name: Run tests
        run: |
          output=$(python -m pytest tests -q 2>&1) || exit_code=$?
          echo "$output"
          count=$(echo "$output" | grep -oE '[0-9]+ passed' | tail -n 1 | grep -oE '[0-9]+')
          if [ -n "$count" ]; then
            echo "### Tests: $count passing" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit ${exit_code:-0}
