name: tests

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-distro:
    name: cross-distro (${{ matrix.distro }}${{ matrix.sdk_label }})
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [opensuse]
    steps:
      - uses: actions/checkout@v5
      - name: Select weekly compiler cache
        id: sdk
        run: echo "epoch=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sdk
        id: image
        with:
          distro: ${{ matrix.distro }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}-
      - name: Verify ${{ matrix.distro }} dependencies, native builds and platform behavior
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -v "$RUNNER_TEMP/ccache:/ccache" \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e MTTKDE_EXPECT_DISTRO=${{ matrix.distro }} \
            -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/repo \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_MAXSIZE=1G \
            '${{ steps.image.outputs.image }}' sh -c '
              git config --global --add safe.directory /repo
              ccache --zero-stats || exit $?
              zypper --non-interactive search --type package --provides --match-exact python3-Pillow || exit $?
              zypper --non-interactive search --type package --provides --match-exact mttkde-deliberately-absent-capability
              [ "$?" = 104 ] || exit 1
              python3 tests/containers/run_in_container.py
              result=$?
              ccache --show-stats
              exit "$result"
            '
