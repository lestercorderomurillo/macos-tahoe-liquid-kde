name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # Primary suite — runs on Arch (CachyOS's parent, the maintainer's
  # daily-driver libdir convention). The full Plasma 6 dev SDK is
  # available here so this is the broadest pytest run.
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        # Dep groups (do NOT inline comments inside the `\`-continued
        # arg list — bash treats `#` mid-command as a line comment and
        # silently drops every arg after it):
        #   - base toolchain: python, pytest, bash, git, diffutils,
        #     findutils, base-devel, cmake, ECM, pkgconf
        #   - Qt6: qt6-base, qt6-declarative, qt6-wayland, qt6-tools
        #   - KF6 frameworks for deps() of the compiled steps
        #   - Plasma / KSysGuard / plasma-workspace cmake configs
        #   - KWin + KDecoration (acrylic-glass kwin effect)
        #   - libepoxy + libdrm + libX11 + libxcb (acrylic-glass effect)
        run: |
          pacman -Syu --noconfirm \
            python python-pytest bash git diffutils findutils \
            base-devel cmake extra-cmake-modules pkgconf \
            qt6-base qt6-declarative qt6-wayland qt6-tools \
            kconfig kconfigwidgets kcoreaddons kcrash kglobalaccel \
            kguiaddons ki18n kio kcmutils knotifications kservice \
            kwidgetsaddons kwindowsystem kdbusaddons kiconthemes \
            libplasma plasma-activities plasma-activities-stats \
            libksysguard plasma-workspace \
            kwin kdecoration \
            libepoxy libdrm libx11 libxcb
      - name: Run tests
        run: |
          output=$(python -m pytest tests -q --ignore=tests/containers 2>&1) || exit_code=$?
          echo "$output"
          count=$(echo "$output" | grep -oE '[0-9]+ passed' | tail -n 1 | grep -oE '[0-9]+')
          if [ -n "$count" ]; then
            echo "### Tests: $count passing" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit ${exit_code:-0}

  # Cross-distro matrix — proves the qmake6-driven path discovery
  # works on every distro the README claims support for. Each leg
  # runs the same container test from tests/containers/, so a regression
  # that breaks one distro can't silently sneak through CI.
  #
  # Gentoo's Dockerfile FROMs a pre-built GHCR base image
  # (ghcr.io/.../mttkde-gentoo-base) so the matrix leg runs in seconds
  # instead of waiting for a source build of qtbase. The base image is
  # built + refreshed by .github/workflows/build-gentoo-base.yml.
  cross-distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - cachyos
          - arch
          - manjaro
          - endeavouros
          - garuda
          - gentoo
          - fedora
          - nobara
          - opensuse
    steps:
      - uses: actions/checkout@v5
      # Gentoo's container FROMs a GHCR image that's built by a
      # separate workflow. Until that image exists / for the brief
      # window between Qt6 upstream bumps and the next monthly base
      # rebuild, treat a Gentoo failure as a warning rather than a
      # red X — every other distro still gates the merge.
      - name: Build and run ${{ matrix.distro }} container
        continue-on-error: ${{ matrix.distro == 'gentoo' }}
        run: |
          docker build \
            -f tests/containers/Dockerfile.${{ matrix.distro }} \
            -t mttkde-test-${{ matrix.distro }}:ci \
            .
          docker run --rm mttkde-test-${{ matrix.distro }}:ci
