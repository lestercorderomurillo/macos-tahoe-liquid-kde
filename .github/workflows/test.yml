name: tests

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ hashFiles('flake.lock') }}-
      - name: Evaluate modules and build Nix packages
        run: nix --extra-experimental-features 'nix-command flakes' flake check . --print-build-logs --max-jobs 2 --cores 2

  # Primary suite — runs on Arch (CachyOS's parent, the maintainer's
  # daily-driver libdir convention). The full Plasma 6 dev SDK is
  # available here so this is the broadest pytest run.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
      packages: write
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sdk
        id: sdk
        with:
          distro: primary
      - uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-primary-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: ccache-primary-${{ matrix.shard }}-
      - name: Run disjoint test shard
        run: |
          mkdir -p build/ccache
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CCACHE_DIR=/repo/build/ccache -e CCACHE_BASEDIR=/repo \
            -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=1G \
            '${{ steps.sdk.outputs.image }}' bash -c '
              set -e
              python -c "import gi; gi.require_version(\"Gtk\", \"4.0\"); from gi.repository import Gtk; from PyQt6 import QtSvg; from PIL import Image"
              QT_QPA_PLATFORM=offscreen python -c "from PyQt6.QtWidgets import QApplication, QStyleFactory; app = QApplication([]); assert QStyleFactory.create(\"kvantum\") is not None"
              command -v rsvg-convert
              for tool in Xvfb node plasmoidviewer xprop; do command -v "$tool"; done
              git config --global --add safe.directory /repo
              ccache --zero-stats
              set +e
              python .github/scripts/test_shard.py ${{ matrix.shard }} 4
              result=$?
              ccache --show-stats
              exit "$result"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.shard }}
          path: build/ci/*.xml

  # Cross-distro matrix — proves the qmake6-driven path discovery
  # works on every distro the README claims support for. Each leg
  # runs the same container test from tests/containers/, so a regression
  # that breaks one distro can't silently sneak through CI.
  cross-distro:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - cachyos
          - arch
          - manjaro
          - endeavouros
          - garuda
          - fedora
          - nobara
          - opensuse
          # Debian testing: native Debian packages and Plasma SDK.
          - debian
          # KDE's current User Edition container. This proves APT package
          # names and the Neon Qt/KF6/Plasma SDK before VM qualification.
          - neon
          # Arch with [kde-unstable] — the newest-KWin compile target
          # (currently Plasma 6.7). Compiles the acrylic-glass effect
          # against the next KWin ABI before any release distro ships
          # it, so a 6.6->6.7-style break fails CI here first.
          - arch-kdeunstable
    steps:
      - uses: actions/checkout@v5
      - name: Select weekly compiler cache
        id: sdk
        run: echo "epoch=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sdk
        id: image
        with:
          distro: ${{ matrix.distro }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}-
      - name: Verify ${{ matrix.distro }} dependencies, native builds and platform behavior
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -v "$RUNNER_TEMP/ccache:/ccache" \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/repo \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_MAXSIZE=1G \
            '${{ steps.image.outputs.image }}' sh -c '
              git config --global --add safe.directory /repo
              ccache --zero-stats || exit $?
              python3 tests/containers/run_in_container.py
              result=$?
              ccache --show-stats
              exit "$result"
            '
