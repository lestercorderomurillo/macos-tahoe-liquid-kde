name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: pacman -Syu --noconfirm python bash git diffutils findutils
      - name: Run tests
        run: bash tests/test.sh

  build-check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install KDE build deps
        run: |
          pacman -Syu --noconfirm \
            base-devel cmake extra-cmake-modules \
            qt6-base qt6-declarative qt6-wayland \
            libplasma kconfig kcoreaddons \
            kwindowsystem ki18n kdbusaddons \
            kcmutils kiconthemes \
            kdecoration plasma-workspace
      - name: Build Menu applet
        run: |
          cd src/offline/plasmoids/org.kde.mac-tahoe-liquid-kde.menu
          mkdir build && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Build Global Menu applet
        run: |
          cd src/offline/plasmoids/org.kde.mac-tahoe-liquid-kde.globalmenu
          mkdir build && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
