name: tests

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Evaluate modules and build Nix packages
        run: |
          docker run --rm -v "$PWD:/source:ro" \
            nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c \
            nix --extra-experimental-features 'nix-command flakes' \
            flake check path:/source --print-build-logs --max-jobs 2 --cores 2

  # Primary suite — runs on Arch (CachyOS's parent, the maintainer's
  # daily-driver libdir convention). The full Plasma 6 dev SDK is
  # available here so this is the broadest pytest run.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    container: archlinux:latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        # Dep groups (do NOT inline comments inside the `\`-continued
        # arg list — bash treats `#` mid-command as a line comment and
        # silently drops every arg after it):
        #   - base toolchain: python, pytest, bash, git, diffutils,
        #     findutils, base-devel, cmake, ECM, pkgconf
        #   - Qt6: qt6-base, qt6-declarative, qt6-wayland, qt6-tools
        #   - KF6 frameworks for deps() of the compiled steps
        #   - Plasma / KSysGuard / plasma-workspace cmake configs
        #   - KWin + KDecoration (acrylic-glass kwin effect)
        #   - libepoxy + libdrm + libX11 + libxcb (acrylic-glass effect)
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm \
            python python-pytest ccache zstd python-pillow python-gobject python-pyqt6 gtk4 \
            qt6-svg qqc2-desktop-style librsvg xorg-server-xvfb xorg-xprop bash git diffutils findutils \
            base-devel cmake extra-cmake-modules pkgconf \
            qt6-base qt6-declarative qt6-wayland qt6-tools \
            kconfig kconfigwidgets kcoreaddons kcrash kglobalaccel \
            kguiaddons ki18n kio kcmutils knotifications kservice \
            kwidgetsaddons kwindowsystem kdbusaddons kiconthemes \
            kitemmodels \
            libplasma plasma-activities plasma-activities-stats \
            libksysguard plasma-workspace plasma-desktop plasma5support plasma-sdk \
            kwin kdecoration kvantum \
            libepoxy libdrm libx11 libxcb libxtst
      - name: Set up Node for JavaScript regression tests
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify native popup test prerequisites
        run: |
          python -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; from PyQt6 import QtSvg; from PIL import Image"
          QT_QPA_PLATFORM=offscreen python -c "from PyQt6.QtWidgets import QApplication, QStyleFactory; app = QApplication([]); assert QStyleFactory.create('kvantum') is not None, 'Kvantum Qt 6 style plugin is required'"
          command -v rsvg-convert
          command -v Xvfb
          node --version
          command -v plasmoidviewer
          command -v xprop
      - uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-primary-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: ccache-primary-${{ matrix.shard }}-
      - name: Run disjoint test shard
        run: |
          ccache --zero-stats
          python .github/scripts/test_shard.py ${{ matrix.shard }} 2
      - name: Report compiler cache usage
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.shard }}
          path: build/ci/*.xml

  # Cross-distro matrix — proves the qmake6-driven path discovery
  # works on every distro the README claims support for. Each leg
  # runs the same container test from tests/containers/, so a regression
  # that breaks one distro can't silently sneak through CI.
  cross-distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - cachyos
          - arch
          - manjaro
          - endeavouros
          - garuda
          - fedora
          - nobara
          - opensuse
          # Debian testing: native Debian packages and Plasma SDK.
          - debian
          # KDE's current User Edition container. This proves APT package
          # names and the Neon Qt/KF6/Plasma SDK before VM qualification.
          - neon
          # Arch with [kde-unstable] — the newest-KWin compile target
          # (currently Plasma 6.7). Compiles the acrylic-glass effect
          # against the next KWin ABI before any release distro ships
          # it, so a 6.6->6.7-style break fails CI here first.
          - arch-kdeunstable
    steps:
      - uses: actions/checkout@v5
      - name: Select weekly compiler cache
        id: sdk
        run: echo "epoch=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.distro }} SDK image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/containers/Dockerfile.${{ matrix.distro }}
          tags: mttkde-test-${{ matrix.distro }}:ci
          load: true
          pull: true
          cache-from: type=gha,scope=sdk-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}
          cache-to: type=gha,mode=max,scope=sdk-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.distro }}-${{ steps.sdk.outputs.epoch }}-
      - name: Verify ${{ matrix.distro }} dependencies, native builds and platform behavior
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          docker run --rm \
            -v "$RUNNER_TEMP/ccache:/ccache" \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/repo \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_MAXSIZE=1G \
            mttkde-test-${{ matrix.distro }}:ci sh -c '
              ccache --zero-stats || exit $?
              python3 tests/containers/run_in_container.py
              result=$?
              ccache --show-stats
              exit "$result"
            '
