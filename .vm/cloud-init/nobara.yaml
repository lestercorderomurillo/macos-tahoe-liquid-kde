#cloud-config
# Nobara smoke guest: start from the Fedora Cloud Base image, enable
# the Nobara COPR repos that GloriousEggroll publishes on Fedora's
# build farm (download.copr.fedorainfracloud.org/results/gloriouseggroll/
# nobara-<fedora-ver>/...), then `dnf install` the KDE stack on top of
# stock Fedora. Run the full install + uninstall flow in a real Plasma
# session.
#
# We point at GloriousEggroll's official COPR project rather than at
# the (historically nonexistent) repos.fyralabs.com/nobara<N> tree —
# Fyra Labs ships Terra Linux, not Nobara. The COPR baseurl is the
# canonical source documented in Nobara-Project/nobara-repo-tools.
# Note: Nobara is rolling-built per Fedora release; only 41, 42, 43,
# 44 are currently live. The probe below picks the highest published
# channel <= the running guest's Fedora release.

users:
  - name: tester
    gecos: VM Tester
    groups: [wheel, sudo, users]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: "$6$mttkdevm$QqkApILBUIQ5/AXpjsoSJGqAlLm1MI2vTZCDEHNYGb.jnyXsjGeVTq3pOCi4JRqh5r.D0GRRHtDiX6Xsb8fcu/"

ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  users:
    - name: tester
      password: tester
      type: text
    - name: root
      password: tester
      type: text

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: true
package_upgrade: false

bootcmd:
  # Belt #3: re-assert tester/root passwords every boot in case the
  # cloud-init users / chpasswd modules raced or got skipped. usermod
  # is on every distro we care about.
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" tester 2>/dev/null || true
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" root 2>/dev/null || true

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      install_nobara_repos() {
          # Resolve the matching Nobara COPR channel for the guest's
          # Fedora release. GloriousEggroll publishes per-release
          # branches at download.copr.fedorainfracloud.org/results/
          # gloriouseggroll/nobara-<N>/. Channels live independently;
          # only the most recent few Fedora releases are kept active.
          local fedora_ver
          fedora_ver="$(rpm -E %fedora 2>/dev/null || echo 44)"

          local copr_base="https://download.copr.fedorainfracloud.org/results/gloriouseggroll"
          local channel="$fedora_ver"
          if ! curl -sfI "${copr_base}/nobara-${channel}/pubkey.gpg" \
              >/dev/null 2>&1; then
              echo "nobara-${channel} not published; falling back" >&2
              local candidate
              for candidate in 44 43 42 41; do
                  if curl -sfI "${copr_base}/nobara-${candidate}/pubkey.gpg" \
                      >/dev/null 2>&1; then
                      channel="$candidate"
                      break
                  fi
              done
          fi

          local mirror="${copr_base}/nobara-${channel}/fedora-${channel}-\$basearch"
          local keyurl="${copr_base}/nobara-${channel}/pubkey.gpg"

          # Pull the COPR signing key locally so dnf doesn't have to
          # fetch + trust it on every transaction.
          curl -L --fail "${copr_base}/nobara-${channel}/pubkey.gpg" \
              -o /etc/pki/rpm-gpg/RPM-GPG-KEY-nobara
          rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-nobara || true

          cat > /etc/yum.repos.d/nobara.repo <<EOF
      [nobara]
      name=Nobara ${channel} (GloriousEggroll COPR)
      baseurl=${mirror}/
      type=rpm-md
      skip_if_unavailable=True
      enabled=1
      gpgcheck=1
      gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara
      repo_gpgcheck=0
      EOF

          dnf clean all
          dnf --refresh repolist
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      install_nobara_repos

      # Brand /etc/os-release as Nobara so distro.current_distro()
      # reports `nobara` (ID_LIKE=fedora keeps the fedora package map
      # in play). Without this the guest still says ID=fedora and the
      # smoke proves nothing nobara-specific.
      cat > /etc/os-release <<'EOF'
      NAME="Nobara Linux"
      PRETTY_NAME="Nobara Linux"
      ID=nobara
      ID_LIKE="fedora"
      VERSION_ID=44
      VERSION_CODENAME=""
      VARIANT="KDE"
      ANSI_COLOR="38;2;132;141;245"
      HOME_URL="https://nobaraproject.org/"
      SUPPORT_URL="https://nobaraproject.org/"
      BUG_REPORT_URL="https://github.com/Nobara-Project/"
      LOGO=fedora-logo-icon
      EOF

      # Install KDE plus Nobara's forked plasma-workspace where it
      # overrides Fedora's; --allowerasing lets dnf swap the
      # conflicting Fedora packages.
      dnf install -y --allowerasing --setopt=install_weak_deps=False \
          @kde-desktop-environment \
          spectacle \
          extra-cmake-modules \
          kdecoration-devel \
          kf6-kcmutils-devel \
          kf6-kconfig-devel \
          kf6-kconfigwidgets-devel \
          kf6-kcoreaddons-devel \
          kf6-kcrash-devel \
          kf6-kglobalaccel-devel \
          kf6-kguiaddons-devel \
          kf6-ki18n-devel \
          kf6-kitemmodels-devel \
          kf6-kio-devel \
          kf6-knotifications-devel \
          kf6-kservice-devel \
          kf6-kwidgetsaddons-devel \
          kf6-kwindowsystem-devel \
          libdrm-devel \
          kwin-devel \
          libX11-devel \
          libepoxy-devel \
          libksysguard-devel \
          libplasma-devel \
          libxcb-devel \
          plasma-activities-devel \
          plasma-activities-stats-devel \
          plasma-workspace-devel \
          qt6-qttools-devel

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/plasmalogin.service ]]; then
          mkdir -p /etc/plasmalogin.conf.d
          cat > /etc/plasmalogin.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable plasmalogin.service
      elif [[ -f /usr/lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      # Mount the host repo into the tester's home + drop a Desktop
      # shortcut so the user lands on a desktop with the project ready
      # to `cd /home/tester/repo && sudo ./install` for manual review.
      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — cd repo && sudo ./install
      Icon=folder
      URL=file:///home/tester/repo
      EOF

      chown -R tester:tester /home/tester/repo /home/tester/Desktop
      # Auto-tail the provision log on TTY login until cloud-init is
      # done. This way the user lands in a shell that SHOWS progress
      # instead of a blinking cursor. The marker file at /var/lib/mttkde/
      # provisioned is touched at the end of provision; once it exists,
      # the next login skips the tail and behaves normally.
      cat > /etc/profile.d/mttkde-vm-progress.sh <<'P'
      #!/bin/sh
      # Only run for the `tester` user, only on TTY logins, only while
      # provisioning is in flight.
      [ "$(id -un)" = "tester" ] || return 0
      case "$(tty)" in /dev/tty*) ;; *) return 0 ;; esac
      [ -f /var/lib/mttkde/provisioned ] && return 0
      [ -f /var/log/mttkde-provision.log ] || return 0
      clear
      echo "=== mttkde-vm: cloud-init is still installing KDE. ==="
      echo "=== Tail of /var/log/mttkde-provision.log below.   ==="
      echo "=== The VM will REBOOT into Plasma when finished.  ==="
      echo "=== (Ctrl-C to drop to shell; re-login to resume.) ==="
      echo
      tail -F /var/log/mttkde-provision.log
      P
      chmod 0644 /etc/profile.d/mttkde-vm-progress.sh


      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

      runcmd:
        - systemctl enable --now sshd || true
        - /usr/local/bin/mttkde-provision.sh
