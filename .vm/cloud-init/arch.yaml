#cloud-config
# Arch Linux cloud smoke guest: install KDE, reboot into a real Plasma
# session, then run ./install + ./uninstall from an autostart.

users:
  - default
  - name: tester
    gecos: Arch Smoke
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tester

ssh_pwauth: true
chpasswd:
  expire: false

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      pacman -Sy --noconfirm
      pacman -S --noconfirm --needed \
          base-devel \
          extra-cmake-modules \
          kdecoration \
          libksysguard \
          libplasma \
          openssh \
          plasma-activities-stats \
          plasma-login-manager \
          plasma-workspace \
          plasma-meta \
          qt6-tools \
          rsync \
          sddm \
          spectacle \
          sudo

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/plasmalogin.service ]]; then
          mkdir -p /etc/plasmalogin.conf.d
          cat > /etc/plasmalogin.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable plasmalogin.service
      elif [[ -f /usr/lib/systemd/system/sddm.service ]] || \
           [[ -f /lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      # Mount the host repo into the tester's home + drop a Desktop
      # shortcut so the user lands on a desktop with the project ready
      # to `cd /home/tester/repo && sudo ./install` for manual review.
      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — cd repo && sudo ./install
      Icon=folder
      URL=file:///home/tester/repo
      EOF

      chown -R tester:tester /home/tester/repo /home/tester/Desktop

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
