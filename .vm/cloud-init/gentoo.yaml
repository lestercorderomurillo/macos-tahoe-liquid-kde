#cloud-config
# Gentoo cloud smoke guest: boot the official systemd cloud-init qcow2,
# switch to the Plasma systemd profile, use the official binhost where
# possible, then run the full install + uninstall flow in a real Plasma
# session.

users:
  - name: tester
    gecos: VM Tester
    groups: [wheel, sudo, users]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: "$6$mttkdevm$QqkApILBUIQ5/AXpjsoSJGqAlLm1MI2vTZCDEHNYGb.jnyXsjGeVTq3pOCi4JRqh5r.D0GRRHtDiX6Xsb8fcu/"

ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  users:
    - name: tester
      password: tester
      type: text
    - name: root
      password: tester
      type: text

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

bootcmd:
  # Belt #3: re-assert tester/root passwords every boot in case the
  # cloud-init users / chpasswd modules raced or got skipped. usermod
  # is on every distro we care about.
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" tester 2>/dev/null || true
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" root 2>/dev/null || true

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      append_make_conf() {
          local line="$1"
          if ! grep -Fqx "$line" /etc/portage/make.conf 2>/dev/null; then
              printf '%s\n' "$line" >> /etc/portage/make.conf
          fi
      }

      select_plasma_profile() {
          local profile_num
          profile_num="$(
              eselect profile list \
                  | sed -n 's/^.*\[\([0-9][0-9]*\)\].*desktop\/plasma\/systemd.*$/\1/p' \
                  | tail -n 1
          )"
          if [[ -z "$profile_num" ]]; then
              echo "No desktop/plasma/systemd Gentoo profile found" >&2
              exit 1
          fi
          eselect profile set "$profile_num"
      }

      configure_binhost() {
          mkdir -p \
              /etc/portage/binrepos.conf \
              /etc/portage/package.accept_keywords \
              /etc/portage/package.use

          cat > /etc/portage/binrepos.conf/gentoo-binhost.conf <<'EOF'
      [binhost]
      priority = 9999
      sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
      EOF

          cat > /etc/portage/package.accept_keywords/all <<'EOF'
      */* ~amd64
      EOF

          cat > /etc/portage/package.use/libxkbcommon <<'EOF'
      x11-libs/libxkbcommon X
      EOF

          # libcanberra is a kde-plasma/kwin dep; its USE="udev" requires
          # USE="alsa" (REQUIRED_USE: udev? ( alsa )). Without this,
          # emerge bails on a REQUIRED_USE constraint instead of letting
          # autounmask resolve it (autounmask only touches USE flags, not
          # REQUIRED_USE clauses, so the user has to pre-seed this).
          cat > /etc/portage/package.use/libcanberra <<'EOF'
      media-libs/libcanberra alsa
      EOF

          # Pre-seed the KDE Plasma USE flags portage's autounmask
          # would otherwise demand. Sourced from the autounmask output
          # of a fresh ::gentoo snapshot build; pre-seeding skips the
          # write-then-rerun loop that autounmask-continue silently
          # drops on this portage version.
          cat > /etc/portage/package.use/mttkde-plasma <<'EOF'
      dev-qt/qtbase opengl wayland cups
      dev-qt/qt5compat qml
      dev-qt/qtmultimedia qml opengl
      dev-qt/qtquick3d opengl
      kde-frameworks/kconfig qml dbus
      kde-frameworks/kguiaddons wayland
      kde-frameworks/kidletime wayland
      kde-frameworks/kwindowsystem wayland X
      kde-frameworks/kcoreaddons dbus
      kde-frameworks/prison qml
      kde-frameworks/sonnet qml
      media-libs/mesa wayland
      media-libs/libglvnd X
      media-libs/libepoxy X
      media-libs/freetype X
      media-libs/fontconfig X
      x11-libs/cairo X opengl
      x11-base/xwayland libei
      sys-apps/dbus X
      sys-apps/systemd policykit
      sys-auth/polkit systemd
      llvm-core/libclc spirv
      dev-util/mesa_clc -debug
      EOF

          if command -v getuto >/dev/null 2>&1; then
              append_make_conf 'FEATURES="${FEATURES} getbinpkg binpkg-request-signature binpkg-multi-instance"'
              getuto
          else
              append_make_conf 'FEATURES="${FEATURES} getbinpkg binpkg-multi-instance"'
          fi
          append_make_conf 'EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --binpkg-respect-use=y --binpkg-changed-deps=n --usepkg --with-bdeps=y"'
          # Disable 32-bit ABI globally. The default multilib stage3
          # has ABI_X86="64 32" which makes fontconfig / harfbuzz /
          # freetype demand expat[abi_x86_32]; expat's local USE doesn't
          # expose that, and the chain dead-ends in
          # `>=dev-libs/expat-2.1.0-r3[abi_x86_32(-),abi_x86_64(-)]`
          # autounmask that cannot resolve. The theme stack doesn't
          # need 32-bit anywhere, so forcing the no-multilib ABI is
          # the honest fix instead of papering over individual packages.
          append_make_conf 'ABI_X86="64"'
      }

      emerge_binpkg() {
          emerge --quiet --getbinpkg --usepkg \
              --binpkg-respect-use=y --binpkg-changed-deps=n \
              --with-bdeps=y "$@"
      }

      emerge_binpkg_with_autounmask() {
          # Try the happy path first.
          if emerge_binpkg "$@"; then
              return 0
          fi

          # First pass: write USE/keyword unmasks portage suggests, but
          # also keep going so it actually merges what it can. Without
          # --autounmask-continue=y emerge writes the config files and
          # then exits without merging anything, leaving us back at
          # square one after etc-update.
          emerge --quiet --getbinpkg --usepkg \
              --binpkg-respect-use=y --binpkg-changed-deps=n \
              --with-bdeps=y --keep-going=y \
              --autounmask-write --autounmask-continue=y \
              --autounmask-keep-keywords=y \
              "$@" || true
          etc-update --automode -5 >/dev/null || true

          # Second pass: same again. The first pass writes config; the
          # second actually merges with those flags now visible.
          emerge --quiet --getbinpkg --usepkg \
              --binpkg-respect-use=y --binpkg-changed-deps=n \
              --with-bdeps=y --keep-going=y \
              --autounmask-write --autounmask-continue=y \
              "$@" || true
          etc-update --automode -5 >/dev/null || true

          # Final pass: plain emerge — anything still failing here is
          # a real slot conflict and we want the non-zero exit so the
          # smoke marks failure rather than booting into a half-broken
          # system.
          emerge_binpkg --keep-going=y "$@"
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      emerge-webrsync --revert=@GENTOO_SNAPSHOT_DATE@
      configure_binhost
      select_plasma_profile
      env-update

      # Single meta target instead of individually-pinned plasma-*
      # components. Pulling kde-plasma/plasma-workspace directly forces
      # portage to satisfy dev-libs/qcoro and dev-qt/qtdeclarative
      # against whichever slots happen to be in the binhost vs the
      # ebuild tree at the moment, which has historically triggered
      # an unresolvable qtdeclarative:6 slot conflict between binhost
      # qcoro (~6.10.2) and tree qt5compat (~6.11.1). plasma-meta lets
      # portage solve the whole graph at once with a consistent slot
      # set. Build deps (sudo / ssh / rsync) come in as plasma-meta
      # transitives or are already present on the cloudinit image.
      emerge_binpkg_with_autounmask --update --deep --newuse \
          kde-plasma/plasma-meta \
          x11-misc/sddm \
          kde-plasma/spectacle \
          net-misc/openssh \
          net-misc/rsync \
          app-admin/sudo

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/sddm.service ]] || \
           [[ -f /lib/systemd/system/sddm.service ]] || \
           [[ -f /etc/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      # Mount the host repo into the tester's home + drop a Desktop
      # shortcut so the user lands on a desktop with the project ready
      # to `cd /home/tester/repo && sudo ./install` for manual review.
      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — cd repo && sudo ./install
      Icon=folder
      URL=file:///home/tester/repo
      EOF

      chown -R tester:tester /home/tester/repo /home/tester/Desktop
      # Auto-tail the provision log on TTY login until cloud-init is
      # done. This way the user lands in a shell that SHOWS progress
      # instead of a blinking cursor. The marker file at /var/lib/mttkde/
      # provisioned is touched at the end of provision; once it exists,
      # the next login skips the tail and behaves normally.
      cat > /etc/profile.d/mttkde-vm-progress.sh <<'P'
      #!/bin/sh
      # Only run for the `tester` user, only on TTY logins, only while
      # provisioning is in flight.
      [ "$(id -un)" = "tester" ] || return 0
      case "$(tty)" in /dev/tty*) ;; *) return 0 ;; esac
      [ -f /var/lib/mttkde/provisioned ] && return 0
      [ -f /var/log/mttkde-provision.log ] || return 0
      clear
      echo "=== mttkde-vm: cloud-init is still installing KDE. ==="
      echo "=== Tail of /var/log/mttkde-provision.log below.   ==="
      echo "=== The VM will REBOOT into Plasma when finished.  ==="
      echo "=== (Ctrl-C to drop to shell; re-login to resume.) ==="
      echo
      tail -F /var/log/mttkde-provision.log
      P
      chmod 0644 /etc/profile.d/mttkde-vm-progress.sh


      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

      runcmd:
        - systemctl enable --now sshd || true
        - /usr/local/bin/mttkde-provision.sh
