#cloud-config
# Garuda smoke guest: start from the Arch cloud image, add the
# Chaotic-AUR repo and the Garuda repo overlay on top of Arch, then
# run the full install + uninstall flow in a real Plasma session.
#
# Both keyrings are pulled as .pkg.tar.zst files directly from the
# vendor mirrors and installed via `pacman -U` — this side-steps the
# historical Chaotic-AUR `pacman-key --recv-keys` keyserver flake.

users:
  - default
  - name: tester
    gecos: Garuda Smoke
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tester

ssh_pwauth: true
chpasswd:
  expire: false

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      install_chaotic_aur() {
          local mirror="https://builds.garudalinux.org/repos/chaotic-aur/x86_64"
          local tmp
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' RETURN

          local keyring_pkg mirrorlist_pkg
          keyring_pkg="$(curl -sL "${mirror}/" \
              | grep -oE 'chaotic-keyring-[0-9][^"<]*-any\.pkg\.tar\.zst' \
              | sort -V | tail -1)"
          mirrorlist_pkg="$(curl -sL "${mirror}/" \
              | grep -oE 'chaotic-mirrorlist-[0-9][^"<]*-any\.pkg\.tar\.zst' \
              | sort -V | tail -1)"
          if [[ -z "$keyring_pkg" || -z "$mirrorlist_pkg" ]]; then
              echo "could not resolve chaotic-keyring / -mirrorlist from ${mirror}" >&2
              exit 1
          fi

          curl -L --fail "${mirror}/${keyring_pkg}" \
              -o "$tmp/chaotic-keyring.pkg.tar.zst"
          curl -L --fail "${mirror}/${mirrorlist_pkg}" \
              -o "$tmp/chaotic-mirrorlist.pkg.tar.zst"

          pacman -U --noconfirm \
              "$tmp/chaotic-keyring.pkg.tar.zst" \
              "$tmp/chaotic-mirrorlist.pkg.tar.zst"

          if ! pacman-key -l >/dev/null 2>&1; then
              pacman-key --init
              pacman-key --populate archlinux
          fi
          pacman-key --populate chaotic

          if ! grep -q '^\[chaotic-aur\]' /etc/pacman.conf; then
              cat >> /etc/pacman.conf <<'EOF'

      [chaotic-aur]
      Include = /etc/pacman.d/chaotic-mirrorlist
      EOF
          fi
      }

      brand_as_garuda() {
          # Garuda doesn't publish a standalone garuda-keyring /
          # garuda-mirrorlist on builds.garudalinux.org/repos/garuda
          # (verified 2026-05-31 — the directory has zero matching
          # packages). Real Garuda installs source keyring + mirrorlist
          # from chaotic-aur, which we already enable above. The
          # remaining piece of being "Garuda" for installer purposes is
          # the /etc/os-release ID — distro.current_distro() keys off
          # that. Write a Garuda-flavoured os-release in place so the
          # installer's distro layer hits its garuda branch (via
          # ID_LIKE=arch) and any future explicit garuda row.
          cat > /etc/os-release <<'EOF'
      NAME="Garuda Linux"
      PRETTY_NAME="Garuda Linux"
      ID=garuda
      ID_LIKE=arch
      BUILD_ID=rolling
      ANSI_COLOR="38;2;23;147;209"
      HOME_URL="https://garudalinux.org/"
      DOCUMENTATION_URL="https://wiki.garudalinux.org/"
      SUPPORT_URL="https://forum.garudalinux.org/"
      BUG_REPORT_URL="https://gitlab.com/garuda-linux/"
      LOGO=garudalinux
      EOF
          pacman -Syy --noconfirm
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      pacman -Sy --noconfirm
      pacman -S --noconfirm --needed \
          base-devel \
          curl \
          gawk \
          openssh \
          rsync \
          sudo

      install_chaotic_aur
      brand_as_garuda

      pacman -S --noconfirm --needed \
          extra-cmake-modules \
          kdecoration \
          libksysguard \
          libplasma \
          plasma-activities-stats \
          plasma-meta \
          plasma-workspace \
          qt6-tools \
          sddm \
          spectacle

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/sddm.service ]] || \
         [[ -f /lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      # Mount the host repo into the tester's home + drop a Desktop
      # shortcut so the user lands on a desktop with the project ready
      # to `cd /home/tester/repo && sudo ./install` for manual review.
      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — cd repo && sudo ./install
      Icon=folder
      URL=file:///home/tester/repo
      EOF

      chown -R tester:tester /home/tester/repo /home/tester/Desktop

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
