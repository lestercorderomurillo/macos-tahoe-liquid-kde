#cloud-config
# CachyOS smoke guest: start from the Arch cloud image, switch it to
# the official CachyOS repos, then run the full install + uninstall
# flow in a real Plasma session.

users:
  - name: tester
    gecos: VM Tester
    groups: [wheel, sudo, users]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: "$6$mttkdevm$QqkApILBUIQ5/AXpjsoSJGqAlLm1MI2vTZCDEHNYGb.jnyXsjGeVTq3pOCi4JRqh5r.D0GRRHtDiX6Xsb8fcu/"

ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  users:
    - name: tester
      password: tester
      type: text
    - name: root
      password: tester
      type: text

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

bootcmd:
  # Belt #3: re-assert tester/root passwords every boot in case the
  # cloud-init users / chpasswd modules raced or got skipped. usermod
  # is on every distro we care about.
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" tester 2>/dev/null || true
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" root 2>/dev/null || true

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      extract_pkg() {
          local archive="$1"
          local dest="$2"
          mkdir -p "$dest"
          if command -v bsdtar >/dev/null 2>&1; then
              bsdtar -xf "$archive" -C "$dest"
          else
              tar --use-compress-program=unzstd -xf "$archive" -C "$dest"
          fi
      }

      bootstrap_cachyos_keyring() {
          local keyring_pkg="$1"
          local keyring_root="$2"

          extract_pkg "$keyring_pkg" "$keyring_root"
          install -Dm0644 \
              "$keyring_root/usr/share/pacman/keyrings/cachyos.gpg" \
              /usr/share/pacman/keyrings/cachyos.gpg
          install -Dm0644 \
              "$keyring_root/usr/share/pacman/keyrings/cachyos-trusted" \
              /usr/share/pacman/keyrings/cachyos-trusted
          install -Dm0644 \
              "$keyring_root/usr/share/pacman/keyrings/cachyos-revoked" \
              /usr/share/pacman/keyrings/cachyos-revoked

          if ! pacman-key -l >/dev/null 2>&1; then
              pacman-key --init
              pacman-key --populate archlinux
          fi
          pacman-key --populate cachyos
          rm -f \
              /usr/share/pacman/keyrings/cachyos.gpg \
              /usr/share/pacman/keyrings/cachyos-trusted \
              /usr/share/pacman/keyrings/cachyos-revoked
      }

      install_cachyos_repos() {
          local tmp
          local keyring_pkg
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' RETURN
          keyring_pkg="$tmp/cachyos-keyring.pkg.tar.zst"
          curl -L --fail \
              https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-keyring-20240331-1-any.pkg.tar.zst \
              -o "$keyring_pkg"
          bootstrap_cachyos_keyring "$keyring_pkg" "$tmp/cachyos-keyring"
          curl -L --fail \
              https://mirror.cachyos.org/cachyos-repo.tar.xz \
              -o "$tmp/cachyos-repo.tar.xz"
          tar -C "$tmp" -xf "$tmp/cachyos-repo.tar.xz"
          sed -i \
              -e '/pacman-key --recv-keys /d' \
              -e '/pacman-key --lsign-key /d' \
              -e 's/pacman -U /pacman -U --noconfirm /' \
              -e 's/pacman -Syu$/pacman -Syu --noconfirm/' \
              "$tmp/cachyos-repo/cachyos-repo.sh"
          (
              cd "$tmp/cachyos-repo"
              ./cachyos-repo.sh --install
          )
          pacman -S --noconfirm --needed cachyos-settings
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      pacman -Sy --noconfirm
      pacman -S --noconfirm --needed \
          base-devel \
          curl \
          gawk \
          openssh \
          rsync \
          sudo

      install_cachyos_repos

      # Real CachyOS KDE Plasma desktop, taken from
      # https://github.com/CachyOS/install-scripts/blob/master/netinstall.yaml
      # (the netinstall.yaml `kde-plasma` group — same list the
      # CachyOS Calamares installer offers). Adds the CachyOS-flavored
      # Emerald + Nord global themes and the Firefox/Octopi bits a
      # fresh CachyOS install ships with.
      pacman -S --noconfirm --needed \
          plasma-meta \
          plasma-desktop plasma-workspace plasma-wayland-protocols plasma-wayland-session \
          plasma-nm plasma-pa plasma-disks plasma-login-manager \
          kwayland-integration egl-wayland \
          sddm sddm-kcm \
          dolphin konsole kate okular gwenview spectacle ark dragon kdeconnect kinfocenter \
          audiocd-kio kio-fuse khotkeys kinit kwallet-pam \
          breeze-gtk kde-gtk-config char-white xsettingsd \
          kscreen powerdevil print-manager solid \
          cachyos-emerald-kde-theme-git cachyos-nord-kde-theme-git \
          firefox octopi \
          extra-cmake-modules kdecoration libksysguard libplasma \
          plasma-activities-stats qt6-tools

      # The CachyOS -Syyuu pulls a newer kernel (linux-cachyos
      # replaces the Arch cloud image's stock `linux`), but the cloud
      # image's grub.cfg still references the old vmlinuz/initramfs
      # names. Without rebuilding here, next boot kernel-panics with
      # "Unable to mount root fs". Force a regen of both the initramfs
      # for every installed kernel AND the grub config so the new
      # entries are picked up.
      mkinitcpio -P || true
      if command -v grub-mkconfig >/dev/null 2>&1 && [[ -d /boot/grub ]]; then
          grub-mkconfig -o /boot/grub/grub.cfg || true
      fi

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/plasmalogin.service ]]; then
          mkdir -p /etc/plasmalogin.conf.d
          cat > /etc/plasmalogin.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable plasmalogin.service
      elif [[ -f /usr/lib/systemd/system/sddm.service ]] || \
           [[ -f /lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      # Mount the host repo into the tester's home + drop a Desktop
      # shortcut so the user lands on a desktop with the project ready
      # to `cd /home/tester/repo && sudo ./install` for manual review.
      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — cd repo && sudo ./install
      Icon=folder
      URL=file:///home/tester/repo
      EOF

      # Open the installer UI automatically on first Plasma login so
      # `./vm` / `./vm all` lands the tester straight on the installer.
      cat > /home/tester/.config/autostart/mttkde-installer.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Name=macos-tahoe-liquid-kde Installer
      Comment=Opens the macOS Tahoe installer UI
      Exec=bash -lc 'sleep 8; cd /home/tester/repo && exec ./installer'
      Icon=system-software-install
      Terminal=false
      X-KDE-autostart-phase=2
      OnlyShowIn=KDE;
      EOF

      chown -R tester:tester /home/tester/repo /home/tester/Desktop /home/tester/.config
      # Auto-tail the provision log on TTY login until cloud-init is
      # done. This way the user lands in a shell that SHOWS progress
      # instead of a blinking cursor. The marker file at /var/lib/mttkde/
      # provisioned is touched at the end of provision; once it exists,
      # the next login skips the tail and behaves normally.
      cat > /etc/profile.d/mttkde-vm-progress.sh <<'P'
      #!/bin/sh
      # Only run for the `tester` user, only on TTY logins, only while
      # provisioning is in flight.
      [ "$(id -un)" = "tester" ] || return 0
      case "$(tty)" in /dev/tty*) ;; *) return 0 ;; esac
      [ -f /var/lib/mttkde/provisioned ] && return 0
      [ -f /var/log/mttkde-provision.log ] || return 0
      clear
      echo "=== mttkde-vm: cloud-init is still installing KDE. ==="
      echo "=== Tail of /var/log/mttkde-provision.log below.   ==="
      echo "=== The VM will REBOOT into Plasma when finished.  ==="
      echo "=== (Ctrl-C to drop to shell; re-login to resume.) ==="
      echo
      tail -F /var/log/mttkde-provision.log
      P
      chmod 0644 /etc/profile.d/mttkde-vm-progress.sh


      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
