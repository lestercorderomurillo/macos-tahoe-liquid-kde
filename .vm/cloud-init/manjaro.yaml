#cloud-config
# Manjaro smoke guest: start from the Arch cloud image, swap the guest
# onto Manjaro's stable repos, then run the full install + uninstall
# flow in a real Plasma session.

users:
  - default
  - name: tester
    gecos: VM Tester
    groups: [wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: '$6$mttkdevm$QqkApILBUIQ5/AXpjsoSJGqAlLm1MI2vTZCDEHNYGb.jnyXsjGeVTq3pOCi4JRqh5r.D0GRRHtDiX6Xsb8fcu/'

ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  list: |
    tester:tester
    root:tester

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      install_manjaro_repos() {
          # Manjaro's stable branch uses a custom mirror redirector. Grab
          # the keyring + manjaro-system packages directly from the
          # repo, install them under the still-Arch pacman, then rewrite
          # /etc/pacman.conf and mirrorlist to point at Manjaro.
          local mirror="https://mirror.alpix.eu/manjaro/stable"
          local tmp
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' RETURN

          # Pull the current keyring + system packages from Manjaro core.
          # We resolve the exact filename from the repo index so this
          # survives keyring version bumps without code edits.
          local keyring_pkg sys_pkg
          keyring_pkg="$(curl -sL "${mirror}/core/x86_64/" \
              | grep -oE 'manjaro-keyring-[0-9][^"<]*-any\.pkg\.tar\.zst' \
              | sort -V | tail -1)"
          sys_pkg="$(curl -sL "${mirror}/core/x86_64/" \
              | grep -oE 'manjaro-system-[0-9][^"<]*-any\.pkg\.tar\.zst' \
              | sort -V | tail -1)"
          if [[ -z "$keyring_pkg" || -z "$sys_pkg" ]]; then
              echo "could not resolve manjaro-keyring / manjaro-system from ${mirror}" >&2
              exit 1
          fi

          curl -L --fail "${mirror}/core/x86_64/${keyring_pkg}" \
              -o "$tmp/manjaro-keyring.pkg.tar.zst"
          curl -L --fail "${mirror}/core/x86_64/${sys_pkg}" \
              -o "$tmp/manjaro-system.pkg.tar.zst"

          pacman -U --noconfirm \
              "$tmp/manjaro-keyring.pkg.tar.zst" \
              "$tmp/manjaro-system.pkg.tar.zst"

          if ! pacman-key -l >/dev/null 2>&1; then
              pacman-key --init
          fi
          pacman-key --populate manjaro

          # Rewrite mirrorlist + pacman.conf to point at Manjaro stable.
          cat > /etc/pacman.d/mirrorlist <<EOF
      ## Manjaro stable mirrorlist (smoke harness)
      Server = ${mirror}/\$repo/\$arch
      EOF

          cat > /etc/pacman.conf <<'EOF'
      [options]
      HoldPkg     = pacman glibc
      Architecture = auto
      CheckSpace
      SigLevel    = Required DatabaseOptional
      LocalFileSigLevel = Optional

      [core]
      Include = /etc/pacman.d/mirrorlist

      [extra]
      Include = /etc/pacman.d/mirrorlist

      [community]
      Include = /etc/pacman.d/mirrorlist

      [multilib]
      Include = /etc/pacman.d/mirrorlist
      EOF

          # Full system upgrade onto Manjaro stable. -yy forces a fresh
          # db sync after the repo swap; -uu allows downgrades where
          # Manjaro is behind Arch on a package.
          pacman -Syyuu --noconfirm --overwrite='*'
      }

      mkdir -p /var/lib/mttkde /repo
      mkdir -p /home/tester/.config/autostart

      pacman -Sy --noconfirm
      pacman -S --noconfirm --needed \
          base-devel \
          curl \
          gawk \
          openssh \
          rsync \
          sudo

      install_manjaro_repos

      pacman -S --noconfirm --needed \
          extra-cmake-modules \
          kdecoration \
          libksysguard \
          libplasma \
          plasma-activities-stats \
          plasma-meta \
          konsole \
          dolphin \
          plasma-workspace \
          qt6-tools \
          sddm \
          spectacle

      # Manjaro's -Syyuu swap replaces the Arch cloud image's kernel.
      # Without rebuilding initramfs + grub.cfg here, next boot kernel-
      # panics with "Unable to mount root fs". Same fix as cachyos.yaml.
      mkinitcpio -P || true
      if command -v grub-mkconfig >/dev/null 2>&1 && [[ -d /boot/grub ]]; then
          grub-mkconfig -o /boot/grub/grub.cfg || true
      fi

      systemctl enable sshd
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"

      if [[ -f /usr/lib/systemd/system/sddm.service ]] || \
         [[ -f /lib/systemd/system/sddm.service ]]; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable sddm.service
      elif systemctl list-unit-files | grep -q '^display-manager\.service'; then
          mkdir -p /etc/sddm.conf.d
          cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
          systemctl enable display-manager.service
      else
          echo "No KDE display manager unit found" >&2
          exit 1
      fi

      # Mount the host repo into the tester's home + drop a Desktop
      # shortcut so the user lands on a desktop with the project ready
      # to `cd /home/tester/repo && sudo ./install` for manual review.
      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — cd repo && sudo ./install
      Icon=folder
      URL=file:///home/tester/repo
      EOF

      chown -R tester:tester /home/tester/repo /home/tester/Desktop
      # Auto-tail the provision log on TTY login until cloud-init is
      # done. This way the user lands in a shell that SHOWS progress
      # instead of a blinking cursor. The marker file at /var/lib/mttkde/
      # provisioned is touched at the end of provision; once it exists,
      # the next login skips the tail and behaves normally.
      cat > /etc/profile.d/mttkde-vm-progress.sh <<'P'
#!/bin/sh
# Only run for the `tester` user, only on TTY logins, only while
# provisioning is in flight.
[ "$(id -un)" = "tester" ] || return 0
case "$(tty)" in /dev/tty*) ;; *) return 0 ;; esac
[ -f /var/lib/mttkde/provisioned ] && return 0
[ -f /var/log/mttkde-provision.log ] || return 0
clear
echo "=== mttkde-vm: cloud-init is still installing KDE. ==="
echo "=== Tail of /var/log/mttkde-provision.log below.   ==="
echo "=== The VM will REBOOT into Plasma when finished.  ==="
echo "=== (Ctrl-C to drop to shell; re-login to resume.) ==="
echo
tail -F /var/log/mttkde-provision.log
P
      chmod 0644 /etc/profile.d/mttkde-vm-progress.sh


      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now sshd || true
  - /usr/local/bin/mttkde-provision.sh
